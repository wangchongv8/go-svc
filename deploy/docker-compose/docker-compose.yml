services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_svc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_svc"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../deploy/sql:/sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "postgres", "-d", "go_svc", "-f", "/sql/001_phase3_schema.sql"]
    environment:
      PGPASSWORD: postgres

  user-rpc:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MAIN: apps/user-rpc/user.go
        SERVICE_CONF_DIR: apps/user-rpc/etc
    command: ["-f", "/app/etc/user.compose.yaml"]
    ports:
      - "9000:9000"

  product-rpc:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MAIN: apps/product-rpc/product.go
        SERVICE_CONF_DIR: apps/product-rpc/etc
    command: ["-f", "/app/etc/product.compose.yaml"]
    ports:
      - "9001:9001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  inventory-rpc:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MAIN: apps/inventory-rpc/inventory.go
        SERVICE_CONF_DIR: apps/inventory-rpc/etc
    command: ["-f", "/app/etc/inventory.compose.yaml"]
    ports:
      - "9002:9002"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  order-rpc:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MAIN: apps/order-rpc/order.go
        SERVICE_CONF_DIR: apps/order-rpc/etc
    command: ["-f", "/app/etc/order.compose.yaml"]
    ports:
      - "9003:9003"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      product-rpc:
        condition: service_started
      inventory-rpc:
        condition: service_started

  gateway-api:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MAIN: apps/gateway-api/gateway.go
        SERVICE_CONF_DIR: apps/gateway-api/etc
    command: ["-f", "/app/etc/gateway-api.compose.yaml"]
    ports:
      - "8080:8080"
      - "6060:6060"
    depends_on:
      - user-rpc
      - product-rpc
      - inventory-rpc
      - order-rpc

  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.4.0
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "3100:3100"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

