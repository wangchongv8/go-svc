---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-rpc-config
  namespace: go-svc
data:
  order.k8s.yaml: |
    Name: order.rpc
    ListenOn: 0.0.0.0:9003
    Dsn: "postgres://postgres:postgres@postgres:5432/go_svc?sslmode=disable"
    ProductRpcConf:
      Target: "product-rpc:9001"
    InventoryRpcConf:
      Target: "inventory-rpc:9002"

    Log:
      Mode: console
      Encoding: json
      Level: info
      Stat: true

    DevServer:
      Enable: true
      Host: 0.0.0.0
      Port: 6060
      MetricsPath: /metrics
      HealthPath: /healthz
      EnableMetrics: true
      EnablePprof: true

    Telemetry:
      Name: order.rpc
      Endpoint: jaeger:4317
      Sampler: 1.0
      Batcher: otlpgrpc
---
apiVersion: v1
kind: Service
metadata:
  name: order-rpc
  namespace: go-svc
spec:
  type: ClusterIP
  selector:
    app: order-rpc
  ports:
    - name: grpc
      port: 9003
      targetPort: 9003
    - name: metrics
      port: 6060
      targetPort: 6060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-rpc
  namespace: go-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-rpc
  template:
    metadata:
      labels:
        app: order-rpc
    spec:
      containers:
        - name: order-rpc
          image: ghcr.io/wangchongv8/go-svc-order-rpc:phase6
          imagePullPolicy: IfNotPresent
          command: ["/app/bin", "-f", "/app/etc/order.k8s.yaml"]
          volumeMounts:
            - name: config
              mountPath: /app/etc/order.k8s.yaml
              subPath: order.k8s.yaml
          readinessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: order-rpc-config
