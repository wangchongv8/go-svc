---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-rpc-config
  namespace: go-svc
data:
  inventory.k8s.yaml: |
    Name: inventory.rpc
    ListenOn: 0.0.0.0:9002
    Dsn: "postgres://postgres:postgres@postgres:5432/go_svc?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-rpc
  namespace: go-svc
spec:
  type: ClusterIP
  selector:
    app: inventory-rpc
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
    - name: metrics
      port: 6060
      targetPort: 6060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-rpc
  namespace: go-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-rpc
  template:
    metadata:
      labels:
        app: inventory-rpc
    spec:
      containers:
        - name: inventory-rpc
          image: ghcr.io/wangchongv8/go-svc-inventory-rpc:phase6
          imagePullPolicy: IfNotPresent
          command: ["/app/bin", "-f", "/app/etc/inventory.k8s.yaml"]
          volumeMounts:
            - name: config
              mountPath: /app/etc/inventory.k8s.yaml
              subPath: inventory.k8s.yaml
          readinessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: inventory-rpc-config
