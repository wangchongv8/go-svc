---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-rpc-config
  namespace: go-svc
data:
  user.k8s.yaml: |
    Name: user.rpc
    ListenOn: 0.0.0.0:9000
---
apiVersion: v1
kind: Service
metadata:
  name: user-rpc
  namespace: go-svc
spec:
  type: ClusterIP
  selector:
    app: user-rpc
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-rpc
  namespace: go-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-rpc
  template:
    metadata:
      labels:
        app: user-rpc
    spec:
      containers:
        - name: user-rpc
          image: ghcr.io/wangchongv8/go-svc-user-rpc:phase5
          imagePullPolicy: IfNotPresent
          command: ["/app/bin", "-f", "/app/etc/user.k8s.yaml"]
          volumeMounts:
            - name: config
              mountPath: /app/etc/user.k8s.yaml
              subPath: user.k8s.yaml
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: user-rpc-config
