---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-config
  namespace: go-svc
data:
  gateway-api.k8s.yaml: |
    Name: gateway-api
    Host: 0.0.0.0
    Port: 8080
    UserRpcConf:
      Target: "user-rpc:9000"
    ProductRpcConf:
      Target: "product-rpc:9001"
    InventoryRpcConf:
      Target: "inventory-rpc:9002"
    OrderRpcConf:
      Target: "order-rpc:9003"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: go-svc
spec:
  type: ClusterIP
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: go-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: ghcr.io/wangchongv8/go-svc-gateway-api:phase5
          imagePullPolicy: IfNotPresent
          command: ["/app/bin", "-f", "/app/etc/gateway-api.k8s.yaml"]
          volumeMounts:
            - name: config
              mountPath: /app/etc/gateway-api.k8s.yaml
              subPath: gateway-api.k8s.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: gateway-api-config
