---
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-create-db
  namespace: go-svc
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: postgres
          command:
            - sh
            - -c
            - |
              psql -h postgres -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'kratos'" | grep -q 1 \
                || psql -h postgres -U postgres -d postgres -c "CREATE DATABASE kratos"
