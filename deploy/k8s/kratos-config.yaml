---
apiVersion: v1
kind: Secret
metadata:
  name: kratos-secret
  namespace: go-svc
type: Opaque
stringData:
  DSN: "postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable"
  secrets.default: "dev-secret-not-for-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
  namespace: go-svc
data:
  kratos.yml: |
    serve:
      public:
        base_url: http://127.0.0.1:4433/
      admin:
        base_url: http://127.0.0.1:4434/

    selfservice:
      default_browser_return_url: http://127.0.0.1:8080/
      allowed_return_urls:
        - http://127.0.0.1:8080/
      flows:
        settings:
          ui_url: http://127.0.0.1:8080/settings
        recovery:
          ui_url: http://127.0.0.1:8080/recovery
        verification:
          ui_url: http://127.0.0.1:8080/verify

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/kratos/identity.schema.json

    courier:
      smtp:
        connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

    dsn: postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable

    hashers:
      algorithm: bcrypt

    secrets:
      default:
        - dev-secret-not-for-production

    log:
      level: info
      format: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-identity-schema
  namespace: go-svc
data:
  identity.schema.json: |
    {
      "$id": "https://schemas.ory.sh/presets/kratos/quickstart/email-password/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Person",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "username": {
              "type": "string",
              "title": "Username",
              "minLength": 1,
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            }
          },
          "required": ["username"],
          "additionalProperties": false
        }
      }
    }
