name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: go fmt
        run: go fmt ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: git diff check
        run: git diff --exit-code
      - name: bash script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: docker compose config
        run: docker compose -f deploy/docker-compose/docker-compose.yml config -q
      - name: yaml syntax check
        run: |
          ruby -e '
          require "yaml"
          Dir.glob("deploy/k8s/*.yaml").each { |f|
            YAML.load_stream(File.read(f))
            puts "#{f}: OK"
          }
          Dir.glob("apps/*/etc/*.yaml").each { |f|
            YAML.load_stream(File.read(f))
            puts "#{f}: OK"
          }
          puts "All YAML files valid"
          '
      - name: make gen (check no drift)
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
          export PATH=$PATH:$(go env GOPATH)/bin
          make gen
          git diff --exit-code
