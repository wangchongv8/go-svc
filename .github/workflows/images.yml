name: Build Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: user-rpc
            main: apps/user-rpc/user.go
            conf_dir: apps/user-rpc/etc
          - name: product-rpc
            main: apps/product-rpc/product.go
            conf_dir: apps/product-rpc/etc
          - name: inventory-rpc
            main: apps/inventory-rpc/inventory.go
            conf_dir: apps/inventory-rpc/etc
          - name: order-rpc
            main: apps/order-rpc/order.go
            conf_dir: apps/order-rpc/etc
          - name: gateway-api
            main: apps/gateway-api/gateway.go
            conf_dir: apps/gateway-api/etc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          platforms: linux/amd64
          build-args: |
            SERVICE_MAIN=${{ matrix.service.main }}
            SERVICE_CONF_DIR=${{ matrix.service.conf_dir }}
          push: true
          tags: ghcr.io/wangchongv8/go-svc-${{ matrix.service.name }}:${{ github.sha }}

      - name: Tag as main (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            ghcr.io/wangchongv8/go-svc-${{ matrix.service.name }}:${{ github.sha }} \
            --tag ghcr.io/wangchongv8/go-svc-${{ matrix.service.name }}:main
