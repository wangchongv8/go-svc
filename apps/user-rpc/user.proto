syntax = "proto3";

package user;

option go_package = "./user";

message GetUserRequest {
    int64 id = 1;
}

message GetUserResponse {
    int64  id       = 1;
    string username = 2;
}

// Phase 9: Kratos identity mapping RPCs.

message GetOrCreateByKratosIdentityRequest {
    string kratos_identity_id = 1;
    string username           = 2;
}

message GetOrCreateByKratosIdentityResponse {
    int64  id       = 1;
    string username = 2;
}

message GetByKratosIdentityRequest {
    string kratos_identity_id = 1;
}

message GetByKratosIdentityResponse {
    int64  id       = 1;
    string username = 2;
}

service UserRpc {
    rpc GetUser(GetUserRequest) returns (GetUserResponse);

    // Phase 9: Kratos identity ↔ local user mapping.
    rpc GetOrCreateByKratosIdentity(GetOrCreateByKratosIdentityRequest) returns (GetOrCreateByKratosIdentityResponse);
    rpc GetByKratosIdentity(GetByKratosIdentityRequest) returns (GetByKratosIdentityResponse);
}
