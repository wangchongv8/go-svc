Name: order.rpc
ListenOn: 0.0.0.0:9003
Dsn: "postgres://postgres:postgres@postgres:5432/go_svc?sslmode=disable"
ProductRpcConf:
  Target: "product-rpc:9001"
InventoryRpcConf:
  Target: "inventory-rpc:9002"

Log:
  Mode: console
  Encoding: json
  Level: info
  Stat: true

DevServer:
  Enable: true
  Host: 0.0.0.0
  Port: 6060
  MetricsPath: /metrics
  HealthPath: /healthz
  EnableMetrics: true
  EnablePprof: true

Telemetry:
  Name: order.rpc
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
